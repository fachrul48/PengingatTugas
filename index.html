<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskReminderVira - Soft & Kawaii</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Quicksand -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #FFFFF4; /* Ivory */
      font-family: 'Quicksand', sans-serif;
      color: #5B4B70;
    }

    /* Soft shadow for depth without harshness */
    .soft-shadow {
      box-shadow: 0 8px 24px rgba(225, 212, 241, 0.4);
    }

    /* Non-blocking Bloom Animation */
    .bloom-overlay {
      pointer-events: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      display: none; /* Hidden by default in plain HTML */
      justify-content: center;
      align-items: center;
    }

    .bloom-overlay.active {
      display: flex;
    }

    .bloom-flower {
      animation: bloom 2s ease-out forwards;
    }

    @keyframes bloom {
      0% { transform: scale(0) rotate(-45deg); opacity: 0; filter: blur(4px); }
      30% { transform: scale(1.5) rotate(15deg); opacity: 1; filter: blur(0px); }
      70% { transform: scale(1.2) rotate(0deg); opacity: 1; }
      100% { transform: scale(2) rotate(20deg); opacity: 0; filter: blur(10px); }
    }

    /* Garden pop-in animation */
    .flower-pop {
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0) translateY(10px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Custom Tooltip */
    .tooltip-container:hover .tooltip-text {
      opacity: 1;
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Bloom Overlay Reward -->
  <div id="bloomOverlay" class="bloom-overlay">
    <div class="bloom-flower text-[#FFB7B2]">
      <i data-lucide="flower-2" style="width: 180px; height: 180px; stroke-width: 1.5;"></i>
    </div>
  </div>

  <!-- Main Container -->
  <div class="max-w-2xl mx-auto px-4 pt-10">
    
    <!-- Header & Encouragement -->
    <div class="mb-10 text-center">
      <h1 class="text-4xl font-bold text-[#A890D3] mb-4 flex justify-center items-center gap-3">
        <i data-lucide="sparkles" class="text-[#FFB7B2]"></i>
        TaskReminderVira
        <i data-lucide="sparkles" class="text-[#FFB7B2]"></i>
      </h1>
      <div id="encouragementText" class="bg-[#FFF4F2] text-[#E08A84] py-4 px-6 rounded-3xl soft-shadow font-semibold text-lg inline-block transition-all duration-300">
        Hai Vira! Tarik napas panjang, mari kita mulai hari ini perlahan-lahan. 🌸
      </div>
    </div>

    <!-- Input Section -->
    <div class="bg-[#EAE0F5] p-6 rounded-[32px] soft-shadow mb-8">
      <form id="taskForm" class="flex flex-col gap-4">
        
        <div class="relative">
          <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
            <i data-lucide="book-open" class="text-[#A890D3]" style="width: 20px; height: 20px;"></i>
          </div>
          <select 
            id="subjectInput"
            class="w-full bg-white text-[#5B4B70] pl-12 pr-4 py-4 rounded-3xl appearance-none focus:outline-none focus:ring-4 focus:ring-[#D8B4E2] transition-all cursor-pointer font-semibold"
            required
          >
            <option value="" disabled selected>Pilih Mata Kuliah...</option>
            <!-- Subjects will be populated via JS -->
          </select>
        </div>

        <div class="flex flex-col sm:flex-row gap-4">
          <input 
            type="text" 
            id="taskInput"
            placeholder="Apa yang perlu Vira kerjakan?"
            class="flex-[2] bg-white pl-6 pr-4 py-4 rounded-3xl focus:outline-none focus:ring-4 focus:ring-[#D8B4E2] transition-all font-medium placeholder-[#B8B8B8]"
            required
          />
          <div class="relative flex-1">
             <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
                <i data-lucide="calendar" class="text-[#A890D3]" style="width: 18px; height: 18px;"></i>
             </div>
             <input 
               type="date" 
               id="deadlineInput"
               class="w-full bg-white pl-10 pr-4 py-4 rounded-3xl focus:outline-none focus:ring-4 focus:ring-[#D8B4E2] transition-all font-medium text-[#5B4B70]"
             />
          </div>
          <button 
            type="submit"
            class="bg-[#FFB7B2] hover:bg-[#FF9B94] text-white font-bold py-4 px-8 rounded-3xl flex justify-center items-center gap-2 transition-transform hover:scale-105 active:scale-95 shadow-md"
          >
            <i data-lucide="plus" style="width: 20px; height: 20px;"></i>
            Tambah
          </button>
        </div>
      </form>
    </div>

    <!-- Task List Section -->
    <div class="mb-10">
      <h2 class="text-2xl font-bold text-[#A890D3] mb-4 px-2">Daftar Tugasmu 📝</h2>
      <div id="taskListContainer" class="space-y-3">
        <!-- Tasks will be injected here -->
      </div>
    </div>

    <!-- Garden Progress Section -->
    <div class="bg-[#F8F3FC] border border-[#EAE0F5] p-6 rounded-[32px] soft-shadow">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-[#A890D3] flex items-center gap-2">
          <i data-lucide="flower-2"></i> Taman Tugas Vira
        </h2>
        <span id="gardenCount" class="bg-[#D8B4E2] text-white px-4 py-1 rounded-full font-bold text-sm">
          0 Bunga Mekar
        </span>
      </div>
      
      <div id="gardenContainer" class="bg-white rounded-3xl p-6 min-h-[160px] flex flex-wrap gap-4 items-start justify-start border-b-8 border-[#EAE0F5]">
        <!-- Flowers will be injected here -->
      </div>
      <p class="text-center text-sm font-medium text-[#A890D3] mt-4 opacity-70">
        Setiap bunga adalah bukti usahamu hari ini. Keep going! 🌱
      </p>
    </div>

  </div>

  <script>
    // --- DATA & STATE ---
    const subjects = [
      'Kewarganegaraan',
      'Internet of Things',
      'Rekayasa Perangkat Lunak',
      'Pengantar Keamanan Informasi',
      'Sistem Informasi dan Layanan TI',
      'Statistika dan Probabilitas',
      'AIK IV',
      'Manajemen Data dan Informasi',
      'Lainnya...'
    ];

    const encouragements = {
      add: [
        "Satu langkah kecil, kamu pasti bisa, Vira!",
        "Catat dulu, kerjakan perlahan. Semangat!",
        "Tugas baru ditambahkan. Jangan lupa minum air ya. 🍵"
      ],
      complete: [
        "Hebat! Satu bunga lagi mekar untukmu, Vira. 🌺",
        "Wah, kamu luar biasa! Bangga deh sama progresmu hari ini. ✨",
        "Pelan tapi pasti, kamu berhasil menyelesaikannya!",
        "Terima kasih sudah berjuang hari ini, Vira."
      ]
    };

    const initialTasks = [
      {
        id: 101,
        text: "Tugas Latihan: Tabel Distribusi Frekuensi & Visualisasi (Data 50-100)",
        subject: "Statistika dan Probabilitas",
        completed: false, 
        deadline: "2026-04-08",
        createdAt: new Date('2026-04-08T12:00:00').toISOString()
      },
      {
        id: 102,
        text: "Soal Latihan Pertemuan 2 (Rentang nilai)",
        subject: "Statistika dan Probabilitas",
        completed: true, 
        deadline: "2026-03-25",
        createdAt: new Date('2026-03-25T12:30:00').toISOString()
      },
      {
        id: 103,
        text: "Tugas Mandiri: ERD Sistem Inventaris Toko Retail",
        subject: "Manajemen Data dan Informasi",
        completed: false, 
        deadline: "2026-04-14",
        createdAt: new Date('2026-04-14T00:00:00').toISOString()
      }
    ];

    let tasks = [];

    // --- DOM ELEMENTS ---
    const subjectSelect = document.getElementById('subjectInput');
    const taskForm = document.getElementById('taskForm');
    const taskInput = document.getElementById('taskInput');
    const deadlineInput = document.getElementById('deadlineInput');
    const taskListContainer = document.getElementById('taskListContainer');
    const gardenContainer = document.getElementById('gardenContainer');
    const gardenCount = document.getElementById('gardenCount');
    const encouragementText = document.getElementById('encouragementText');
    const bloomOverlay = document.getElementById('bloomOverlay');

    // --- INITIALIZATION ---
    function init() {
      // Populate subjects
      subjects.forEach(sub => {
        const option = document.createElement('option');
        option.value = sub;
        option.textContent = sub;
        subjectSelect.appendChild(option);
      });

      // Load data from localStorage
      const savedTasks = localStorage.getItem('viraTasksVanilla');
      if (savedTasks) {
        const parsedTasks = JSON.parse(savedTasks);
        if (parsedTasks.length === 0) {
          tasks = [...initialTasks];
        } else {
          const hasPreloaded = parsedTasks.some(t => t.id === 101 || t.id === 102);
          tasks = hasPreloaded ? parsedTasks : [...initialTasks, ...parsedTasks];
        }
      } else {
        tasks = [...initialTasks];
      }

      render();
      lucide.createIcons(); // Initialize icons
    }

    // --- RENDER LOGIC (The Vanilla JS alternative to React's Virtual DOM) ---
    function render() {
      renderTasks();
      renderGarden();
      saveData();
      lucide.createIcons(); // Re-initialize icons for newly added DOM elements
    }

    function renderTasks() {
      taskListContainer.innerHTML = '';
      const pendingTasks = tasks.filter(t => !t.completed);

      if (pendingTasks.length === 0) {
        taskListContainer.innerHTML = `
          <div class="bg-white/60 border-2 border-dashed border-[#D8B4E2] rounded-[32px] p-8 text-center text-[#A890D3]">
            <i data-lucide="leaf" style="width: 32px; height: 32px;" class="mx-auto mb-3 opacity-50"></i>
            <p class="font-semibold">Yeay! Tidak ada tugas yang tertunda. <br/>Vira boleh rebahan dulu~</p>
          </div>
        `;
        return;
      }

      pendingTasks.forEach(task => {
        const deadlineHtml = task.deadline ? `
          <span class="text-xs font-semibold text-[#A890D3] bg-[#F8F3FC] px-2 py-1 rounded-xl flex items-center gap-1 w-max border border-[#EAE0F5]">
            <i data-lucide="calendar" style="width: 12px; height: 12px;"></i> ${formatDateFriendly(task.deadline)}
          </span>
        ` : '';

        const taskEl = document.createElement('div');
        taskEl.className = "bg-white p-5 rounded-3xl flex items-center justify-between gap-4 soft-shadow group hover:bg-[#FDFBFF] transition-colors";
        taskEl.innerHTML = `
          <div class="flex items-center gap-4 flex-1">
            <button onclick="toggleComplete(${task.id})" class="w-8 h-8 rounded-full border-2 border-[#D8B4E2] hover:bg-[#D8B4E2] hover:text-white flex items-center justify-center transition-all flex-shrink-0 text-[#D8B4E2] hover:text-white">
              <i data-lucide="check" style="width: 16px; height: 16px; stroke-width: 3;"></i>
            </button>
            <div>
              <div class="flex flex-wrap items-center gap-2 mb-1">
                <span class="text-xs font-bold text-[#FFB7B2] bg-[#FFF4F2] px-2 py-1 rounded-xl block w-max">
                  ${task.subject}
                </span>
                ${deadlineHtml}
              </div>
              <p class="font-semibold text-lg">${task.text}</p>
            </div>
          </div>
          <button onclick="deleteTask(${task.id})" class="text-[#E08A84] hover:text-red-500 hover:bg-red-50 p-2 rounded-full transition-all opacity-0 group-hover:opacity-100 focus:opacity-100" aria-label="Hapus tugas">
            <i data-lucide="trash-2" style="width: 20px; height: 20px;"></i>
          </button>
        `;
        taskListContainer.appendChild(taskEl);
      });
    }

    function renderGarden() {
      gardenContainer.innerHTML = '';
      const completedTasks = tasks.filter(t => t.completed);
      
      gardenCount.textContent = `${completedTasks.length} Bunga Mekar`;

      if (completedTasks.length === 0) {
        gardenContainer.innerHTML = `
          <div class="w-full h-full flex flex-col justify-center items-center text-[#C4B5DA] opacity-60 mt-4">
            <i data-lucide="leaf" style="width: 40px; height: 40px;" class="mb-2"></i>
            <p class="font-medium text-center">Taman masih kosong.<br/>Selesaikan 1 tugas untuk menanam bunga pertamamu!</p>
          </div>
        `;
        return;
      }

      completedTasks.forEach((task, index) => {
        const flowerEl = document.createElement('div');
        flowerEl.className = "flower-pop relative cursor-help tooltip-container";
        flowerEl.style.animationDelay = `${(index % 10) * 0.1}s`;
        flowerEl.innerHTML = `
          <i data-lucide="flower-2" style="width: 48px; height: 48px; stroke-width: 1.5;" class="text-[#FFB7B2] drop-shadow-sm hover:scale-110 transition-transform fill-[#FFF4F2]"></i>
          <div class="tooltip-text absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-max max-w-[150px] bg-white text-[#5B4B70] text-xs p-2 rounded-xl soft-shadow opacity-0 pointer-events-none transition-opacity text-center font-semibold z-10">
            ${task.text}
          </div>
        `;
        gardenContainer.appendChild(flowerEl);
      });
    }

    // --- ACTIONS & HANDLERS ---
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const text = taskInput.value.trim();
      const subject = subjectSelect.value;
      const deadline = deadlineInput.value;

      if (!text || !subject) return;

      const newTask = {
        id: Date.now(),
        text: text,
        subject: subject,
        completed: false,
        deadline: deadline,
        createdAt: new Date().toISOString()
      };

      tasks.unshift(newTask); // Add to beginning
      
      // Reset form
      taskInput.value = '';
      deadlineInput.value = '';
      subjectSelect.selectedIndex = 0;
      
      setEncouragement(encouragements.add[Math.floor(Math.random() * encouragements.add.length)]);
      render();
    });

    window.toggleComplete = function(id) {
      const taskIndex = tasks.findIndex(t => t.id === id);
      if (taskIndex > -1) {
        const task = tasks[taskIndex];
        if (!task.completed) {
          triggerBloom();
          setEncouragement(encouragements.complete[Math.floor(Math.random() * encouragements.complete.length)]);
          task.completed = true;
        } else {
          task.completed = false; // Allow unchecking
        }
        
        checkAllCompleted();
        render();
      }
    };

    window.deleteTask = function(id) {
      tasks = tasks.filter(t => t.id !== id);
      render();
    };

    // --- HELPERS & EFFECTS ---
    function triggerBloom() {
      bloomOverlay.classList.add('active');
      setTimeout(() => {
        bloomOverlay.classList.remove('active');
      }, 2000);
    }

    function setEncouragement(text) {
      encouragementText.style.opacity = 0;
      setTimeout(() => {
        encouragementText.textContent = text;
        encouragementText.style.opacity = 1;
      }, 300);
    }

    function checkAllCompleted() {
      if (tasks.filter(t => !t.completed).length === 0 && tasks.length > 0) {
        setEncouragement("Semua tugas selesai! Kamu hebat banget, Vira. Selamat istirahat! 🛋️");
      }
    }

    function formatDateFriendly(dateString) {
      if (!dateString) return '';
      const options = { day: 'numeric', month: 'short', year: 'numeric' };
      return new Date(dateString).toLocaleDateString('id-ID', options);
    }

    function saveData() {
      localStorage.setItem('viraTasksVanilla', JSON.stringify(tasks));
    }

    // Start App
    init();

  </script>
</body>
</html>
